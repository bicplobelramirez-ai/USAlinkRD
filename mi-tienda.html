<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USALINK — Bruce's Picks</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#081B4B;--deep:#050f2e;--red:#E31E24;--sky:#3B9EFF;--white:#fff;--muted:#8ba0c8;--line:rgba(255,255,255,.10);--green:#27e36a;--gold:#FFD166;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--deep);color:var(--white);-webkit-font-smoothing:antialiased;max-width:460px;margin:0 auto;padding-bottom:80px}
header{background:var(--navy);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.mark{width:36px;height:36px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.htxt b{font-family:'Bebas Neue';font-size:20px;display:block;line-height:1}
.htxt small{font-size:8px;color:var(--muted);letter-spacing:2px;font-weight:600}
.back-btn{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--white);text-decoration:none}
.hero{padding:18px 16px;background:linear-gradient(135deg,#0d0820,#1a0c35);border-bottom:1px solid var(--line)}
.hero h2{font-family:'Bebas Neue';font-size:30px;line-height:.92}
.hero h2 em{color:var(--red);font-style:normal;display:block}
.hero p{font-size:12px;color:#d4b8c8;margin-top:5px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f-chip{display:inline-flex;align-items:center;gap:5px;background:#0a1f52;border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap}
.f-chip.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:linear-gradient(160deg,#0c2257,#081B4B);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;transition:.15s}
.card:active{transform:scale(.97)}
.card-img{width:100%;height:130px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line);overflow:hidden;font-size:44px}
.card-img img{width:100%;height:100%;object-fit:cover}
.cbadge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:800;padding:3px 8px;border-radius:6px}
.cdisc{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:6px}
.card-body{padding:10px}
.card-brand{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--sky);margin-bottom:3px}
.card-name{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:5px;min-height:30px}
.card-price{font-family:'Bebas Neue';font-size:18px}
.card-orig{font-size:10px;color:var(--muted);text-decoration:line-through;margin-left:4px}
.card-stock{font-size:10px;color:var(--muted);margin-top:3px}
.btn-add{width:100%;border:none;cursor:pointer;font-family:'DM Sans';font-weight:700;border-radius:8px;font-size:11px;padding:9px;margin-top:6px;background:var(--red);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;font-size:13px;line-height:1.6}
.loading{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;font-size:14px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:linear-gradient(165deg,#0c2257,#081B4B);border-radius:22px 22px 0 0;padding:22px 18px 32px;width:100%;max-width:460px;border-top:1px solid var(--line);max-height:88vh;overflow-y:auto}
.modal-img{width:100%;height:160px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:14px}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-brand{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--sky);margin-bottom:3px}
.modal-name{font-family:'Bebas Neue';font-size:26px;line-height:.95;margin-bottom:10px}
.modal-price{font-family:'Bebas Neue';font-size:34px}
.modal-orig{font-size:13px;color:var(--muted);text-decoration:line-through;margin-left:8px}
.modal-save{display:inline-block;background:rgba(39,227,106,.1);border:1px solid rgba(39,227,106,.25);color:var(--green);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin:8px 0 14px}
.attrs-box{background:rgba(255,255,255,.04);border-radius:12px;padding:4px 14px;margin-bottom:14px}
.attr-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.attr-line:last-child{border:none}
.attr-line .k{color:var(--muted)}.attr-line .v{font-weight:700}
.modal-desc{font-size:13px;color:#cfe0ff;line-height:1.6;margin-bottom:14px}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.qbtn{width:36px;height:36px;border-radius:50%;background:#0a1f52;border:1px solid var(--line);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.qnum{font-family:'Bebas Neue';font-size:22px}
.btn-buy{width:100%;border:none;cursor:pointer;font-family:'DM Sans';font-weight:700;border-radius:12px;font-size:15px;padding:15px;background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(227,30,36,.3);margin-bottom:10px}
.btn-cls{width:100%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-family:'DM Sans';font-weight:600;border-radius:12px;font-size:13px;padding:12px;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;font-weight:700;font-size:13px;padding:10px 20px;border-radius:30px;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:var(--navy);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 14px;z-index:30}
nav.bottom a{color:var(--muted);font-size:11px;text-align:center;text-decoration:none;font-weight:600}
nav.bottom a .ic{font-size:20px;display:block;margin-bottom:3px}
nav.bottom a.active{color:var(--red)}
.ia-btn{position:relative;top:-14px;background:var(--red);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 18px rgba(227,30,36,.5);font-size:22px;border:2px solid var(--deep)}
</style>
</head>
<body>

<header>
  <div class="mark">🔗</div>
  <div class="htxt"><b>BRUCE'S PICKS</b><small>USALINK · MI TIENDA</small></div>
  <a href="/" class="back-btn">← Inicio</a>
</header>

<div class="hero">
  <h2>MI TIENDA,<br><em>MIS MEJORES OFERTAS.</em></h2>
  <p>Productos seleccionados por Bruce, directo desde EE.UU. · Precio todo incluido a RD.</p>
</div>

<div class="filters">
  <div class="f-chip on" onclick="filter(this,'todo')">🏪 Todo</div>
  <div class="f-chip" onclick="filter(this,'Calzado')">👟 Calzado</div>
  <div class="f-chip" onclick="filter(this,'Ropa')">👗 Ropa</div>
  <div class="f-chip" onclick="filter(this,'Tech')">💻 Tech</div>
  <div class="f-chip" onclick="filter(this,'Belleza')">💄 Belleza</div>
  <div class="f-chip" onclick="filter(this,'Nuevo')">✨ Nuevo</div>
  <div class="f-chip" onclick="filter(this,'Usado')">🔄 Usado</div>
</div>

<div class="grid" id="grid">
  <div class="loading">⏳ Cargando productos...</div>
</div>

<div class="overlay" id="overlay" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-img" id="mImg"></div>
    <div class="modal-brand" id="mBrand"></div>
    <div class="modal-name" id="mName"></div>
    <div><span class="modal-price" id="mPrice"></span><span class="modal-orig" id="mOrig"></span></div>
    <span class="modal-save" id="mSave"></span>
    <div class="attrs-box" id="mAttrs"></div>
    <div class="modal-desc" id="mDesc"></div>
    <div class="qty-row">
      <button class="qbtn" onclick="qty(-1)">-</button>
      <span class="qnum" id="qNum">1</span>
      <button class="qbtn" onclick="qty(1)">+</button>
      <span style="font-size:12px;color:var(--muted)">unidades</span>
    </div>
    <button class="btn-buy" onclick="buy()">🛒 Ordenar este producto</button>
    <button class="btn-cls" onclick="closeModal()">← Volver</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottom">
  <a href="/"><span class="ic">🏠</span>Inicio</a>
  <a href="#" class="active"><span class="ic">🛍️</span>Tienda</a>
  <a href="/" class="ia-btn">🤖</a>
  <a href="/orden.html"><span class="ic">🔗</span>Ordenar</a>
  <a href="/"><span class="ic">👤</span>Cuenta</a>
</nav>

<script>
var BASE='appSrCkBCihEkjQRE';
var TABLE='tbl3ypuRZ6cnGICdP';
var AT='https://api.airtable.com/v0/'+BASE+'/'+TABLE;
var TOKEN='';
var products=[];
var activeFilter='todo';
var currentProd=null;
var currentQty=1;

function getToken(){
  if(TOKEN) return TOKEN;
  TOKEN=localStorage.getItem('usal_at')||'';
  return TOKEN;
}

function loadProducts(){
  var tk=getToken();
  if(!tk){
    document.getElementById('grid').innerHTML='<div class="empty">Tienda en mantenimiento.<br>Vuelve pronto.</div>';
    return;
  }
  fetch(AT+'?filterByFormula=AND({Activo})&sort[0][field]=Nombre',{
    headers:{'Authorization':'Bearer '+tk}
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.records||!d.records.length){
      document.getElementById('grid').innerHTML='<div class="empty">Productos proximamente.<br>Vuelve pronto!</div>';
      return;
    }
    products=d.records.map(function(rec){return{
      id:rec.id,
      nombre:rec.fields.Nombre||'',
      marca:rec.fields.Marca||'',
      categoria:rec.fields.Categoria||'Otro',
      estado:rec.fields.Estado||'Nuevo',
      precio:rec.fields.Precio||0,
      precioOriginal:rec.fields.Precio_Original||0,
      stock:rec.fields.Stock||0,
      descripcion:rec.fields.Descripcion||'',
      atributos:rec.fields.Atributos||'',
      imagen:rec.fields.Imagen||''
    };});
    renderGrid();
  })
  .catch(function(){
    document.getElementById('grid').innerHTML='<div class="empty">Error cargando productos.<br>Intenta de nuevo.</div>';
  });
}

function renderGrid(){
  var grid=document.getElementById('grid');
  var list=products;
  if(activeFilter==='Nuevo') list=products.filter(function(p){return p.estado==='Nuevo';});
  else if(activeFilter==='Usado') list=products.filter(function(p){return p.estado==='Usado';});
  else if(activeFilter!=='todo') list=products.filter(function(p){return p.categoria===activeFilter;});
  if(!list.length){
    grid.innerHTML='<div class="empty">No hay productos en esta categoria aun.</div>';
    return;
  }
  grid.innerHTML=list.map(function(p){
    var disc=p.precioOriginal?Math.round((1-p.precio/p.precioOriginal)*100):null;
    return(
      '<div class="card" onclick="openModal(\''+p.id+'\')">'+ 
      '<span class="cbadge '+(p.estado==='Nuevo'?'st-nuevo':'st-usado')+'" style="'+(p.estado==='Nuevo'?'background:rgba(39,227,106,.15);color:#27e36a':'background:rgba(255,209,102,.15);color:#FFD166')+'">'+
      (p.estado==='Nuevo'?'NUEVO':'USADO')+'</span>'+
      (disc?'<span class="cdisc">-'+disc+'%</span>':'')+
      '<div class="card-img">'+(p.imagen?'<img src="'+p.imagen+'">'  :'📦')+'</div>'+
      '<div class="card-body">'+
      '<div class="card-brand">'+p.marca.toUpperCase()+'</div>'+
      '<div class="card-name">'+p.nombre+'</div>'+
      '<div><span class="card-price">$'+p.precio.toFixed(2)+'</span>'+(p.precioOriginal?'<span class="card-orig">$'+p.precioOriginal.toFixed(2)+'</span>':'')+'</div>'+
      '<div class="card-stock">Quedan <b>'+p.stock+'</b></div>'+
      '<button class="btn-add">🛒 Comprar</button>'+
      '</div></div>'
    );
  }).join('');
}

function filter(el,f){
  document.querySelectorAll('.f-chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on');activeFilter=f;renderGrid();
}

function openModal(id){
  currentProd=null;
  for(var i=0;i<products.length;i++){if(products[i].id===id){currentProd=products[i];break;}}
  if(!currentProd)return;
  currentQty=1;
  document.getElementById('mImg').innerHTML=currentProd.imagen?'<img src="'+currentProd.imagen+'">'  :'📦';
  document.getElementById('mBrand').textContent=currentProd.marca.toUpperCase();
  document.getElementById('mName').textContent=currentProd.nombre;
  document.getElementById('mPrice').textContent='$'+currentProd.precio.toFixed(2);
  document.getElementById('mOrig').textContent=currentProd.precioOriginal?' $'+currentProd.precioOriginal.toFixed(2):'';
  var disc=currentProd.precioOriginal?Math.round((1-currentProd.precio/currentProd.precioOriginal)*100):null;
  document.getElementById('mSave').textContent=disc?'Ahorras '+disc+'% + Envio incluido a RD':'Envio incluido a RD';
  document.getElementById('mDesc').textContent=currentProd.descripcion||'Producto disponible en Miami, listo para envio a RD.';
  document.getElementById('qNum').textContent=1;
  var lines=currentProd.atributos?currentProd.atributos.split('\n').filter(Boolean).map(function(l){
    var parts=l.split(':');
    return'<div class="attr-line"><span class="k">'+parts[0].trim()+'</span><span class="v">'+(parts.slice(1).join(':').trim())+'</span></div>';
  }).join(''):'';
  document.getElementById('mAttrs').innerHTML=lines+'<div class="attr-line"><span class="k">Stock</span><span class="v">'+currentProd.stock+' disponibles</span></div>';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function bgClose(e){if(e.target.id==='overlay')closeModal();}
function qty(d){currentQty=Math.max(1,currentQty+d);document.getElementById('qNum').textContent=currentQty;}
function buy(){closeModal();window.location.href='/orden.html';}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

loadProducts();
</script>
</body>
</html>
