<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="USALINK — Compra en USA. Recibe en tu país.">
<title>USALINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --navy:   #081B4B;
  --navy2:  #0d2560;
  --navy3:  #050f2b;
  --navy4:  #031020;
  --red:    #E31E24;
  --red2:   #ff3b41;
  --red3:   #b01219;
  --white:  #FFFFFF;
  --off:    #F3F5FB;
  --g50:    #f9fafd;
  --g100:   #eef0f8;
  --g200:   #dde2f0;
  --g300:   #c4cce0;
  --g400:   #8b96b8;
  --g500:   #5d6a8e;
  --g600:   #3d4a6b;
  --g800:   #1a2240;
  --gold:   #F5A623;
  --green:  #10b981;
  --green2: #34d399;

  --fd: 'Bebas Neue', sans-serif;
  --fb: 'DM Sans', sans-serif;
  --fm: 'JetBrains Mono', monospace;

  --r-xs:  6px;
  --r-sm:  10px;
  --r-md:  16px;
  --r-lg:  22px;
  --r-xl:  28px;
  --r-f:   999px;

  --sh-sm: 0 2px 12px rgba(8,27,75,.07);
  --sh-md: 0 6px 24px rgba(8,27,75,.11);
  --sh-lg: 0 14px 44px rgba(8,27,75,.16);
  --sh-xl: 0 24px 64px rgba(8,27,75,.22);
  --sh-r:  0 6px 24px rgba(227,30,36,.32);

  --tr:  .28s cubic-bezier(.4,0,.2,1);
  --trf: .15s cubic-bezier(.4,0,.2,1);

  --sat: env(safe-area-inset-top,    0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left,   0px);
  --sar: env(safe-area-inset-right,  0px);

  --bnav-h: 62px;
  --topnav-h: 56px;
}

/* ── RESET ── */
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html { font-size: 16px; scroll-behavior: smooth; height: 100%; }
body {
  font-family: var(--fb);
  background: var(--off);
  color: var(--g800);
  overflow: hidden;
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
ul { list-style: none; }
input, select { font-family: inherit; }
::selection { background: rgba(227,30,36,.15); }
::-webkit-scrollbar { display: none; }

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--off);
}

/* Status bar spacer */
.status-space {
  height: var(--sat);
  background: var(--navy3);
  flex-shrink: 0;
}

/* ── TOP NAV ── */
#topnav {
  flex-shrink: 0;
  height: var(--topnav-h);
  background: rgba(8,27,75,.97);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center;
  padding: 0 14px;
  justify-content: space-between;
  gap: 8px;
  position: relative; z-index: 200;
}
.tn-logo { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.tn-logo-box {
  width: 34px; height: 34px; background: var(--red);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 12px rgba(227,30,36,.45);
  flex-shrink: 0; transition: var(--trf);
}
.tn-logo-box:active { transform: scale(.93); }
.tn-logo-name {
  font-family: var(--fd); font-size: 20px; color: #fff; letter-spacing: .08em; line-height: 1;
}
.tn-logo-sub {
  font-size: 9px; font-weight: 700; color: rgba(255,255,255,.5);
  letter-spacing: .06em; text-transform: uppercase; margin-top: 2px;
  white-space: nowrap;
}

/* URL pill — center */
.tn-url-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--r-f);
  padding: 5px 11px;
  font-family: var(--fm); font-size: 10px;
  color: rgba(255,255,255,.65);
  letter-spacing: .04em;
  white-space: nowrap;
  transition: var(--trf);
  text-decoration: none;
  flex-shrink: 1; min-width: 0; overflow: hidden;
}
.tn-url-pill:active {
  background: rgba(255,255,255,.14);
  color: #fff;
}
.tn-url-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  animation: pulse 2s infinite;
}

.tn-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.tn-icon {
  width: 32px; height: 32px;
  background: rgba(255,255,255,.08);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.7); font-size: 14px; transition: var(--trf);
}
.tn-icon:active { background: rgba(255,255,255,.18); }
.tn-cta {
  background: var(--red); color: #fff;
  font-size: 12px; font-weight: 700; letter-spacing: .02em;
  padding: 7px 14px; border-radius: var(--r-f);
  box-shadow: var(--sh-r); transition: var(--trf);
  white-space: nowrap; text-decoration: none;
}
.tn-cta:active { transform: scale(.96); }

/* ── PAGE CONTAINER ── */
#pages {
  flex: 1; overflow: hidden; position: relative;
}
.page {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity: 0; pointer-events: none;
  transform: translateY(12px);
  transition: opacity .3s ease, transform .3s ease;
  padding-bottom: calc(var(--bnav-h) + var(--sab) + 16px);
}
.page.active {
  opacity: 1; pointer-events: all; transform: translateY(0);
}

/* ── BOTTOM NAV ── */
#bnav {
  flex-shrink: 0;
  height: calc(var(--bnav-h) + var(--sab));
  padding-bottom: var(--sab);
  background: rgba(8,27,75,.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: stretch;
  position: relative; z-index: 200;
}
.bn-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  color: rgba(255,255,255,.38); font-size: 10px; font-weight: 600;
  letter-spacing: .02em; transition: var(--trf);
  padding-top: 6px;
  position: relative;
}
.bn-item.active { color: #fff; }
.bn-item.active .bn-icon { color: #fff; filter: drop-shadow(0 0 8px rgba(227,30,36,.7)); }
.bn-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--red); margin-top: 1px;
  display: none;
}
.bn-item.active .bn-dot { display: block; }
.bn-icon { transition: var(--trf); }
.bn-item:active { transform: scale(.92); }
.bn-badge {
  position: absolute; top: 6px; right: calc(50% - 16px);
  background: var(--red); color: #fff;
  font-size: 8px; font-weight: 800;
  width: 14px; height: 14px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--navy3);
}

/* ═══════════════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════════════ */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
  padding: 5px 12px; border-radius: var(--r-f);
}
.tag-red   { background: rgba(227,30,36,.09); color: var(--red); border: 1px solid rgba(227,30,36,.2); }
.tag-white { background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.15); }
.tag-green { background: rgba(16,185,129,.1); color: var(--green); border: 1px solid rgba(16,185,129,.2); }

.section-lbl {
  font-family: var(--fd); font-size: 22px; color: var(--navy);
  letter-spacing: .02em; display: flex; align-items: center; gap: 8px;
}

.chip-bar {
  display: flex; gap: 7px; padding: 10px 16px;
  overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  background: #fff; border-bottom: 1px solid var(--g200);
}
.chip {
  flex-shrink: 0; padding: 7px 14px; border-radius: var(--r-f);
  font-size: 12px; font-weight: 600; color: var(--g500);
  background: var(--g100); border: 1.5px solid transparent;
  transition: var(--trf); white-space: nowrap;
}
.chip:active { transform: scale(.95); }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); box-shadow: 0 2px 10px rgba(8,27,75,.22); }

@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }
.live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
.au  { animation: fadeUp .45s ease both; }
.d1  { animation-delay: .07s; }
.d2  { animation-delay: .14s; }
.d3  { animation-delay: .21s; }
.d4  { animation-delay: .28s; }
.d5  { animation-delay: .35s; }

/* ═══════════════════════════════════════════
   PAGE 1 — HOME (landing)
═══════════════════════════════════════════ */
#page-home {}

/* ── HERO SLIDER ── */
.hero-slider {
  position: relative; overflow: hidden;
  background: var(--navy3);
  height: 200px;          /* compact height */
  flex-shrink: 0;
}

/* track holds all slides side by side */
.hs-track {
  display: flex; height: 100%;
  transition: transform .52s cubic-bezier(.4,0,.2,1);
  will-change: transform;
}

/* individual slide */
.hs-slide {
  flex-shrink: 0; width: 100%; height: 100%;
  position: relative; overflow: hidden;
  display: flex; align-items: flex-end;
  padding: 0 20px 20px;
}

/* subtle grid bg */
.hs-slide::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 36px 36px;
  mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 20%, transparent 100%);
  pointer-events: none; z-index: 0;
}

/* per-slide gradient overlays */
.hs-slide-1 { background: linear-gradient(145deg, #050f2b 0%, #081b4b 100%); }
.hs-slide-2 { background: linear-gradient(145deg, #0d1f4e 0%, #0a2866 100%); }
.hs-slide-3 { background: linear-gradient(145deg, #0a1a3d 0%, #061230 100%); }
.hs-slide-4 { background: linear-gradient(145deg, #0d2030 0%, #071428 100%); }
.hs-slide-5 { background: linear-gradient(145deg, #7a2800 0%, #f1641e 100%); }
.hs-slide-6 { background: linear-gradient(145deg, #0a0a14 0%, #1a0a2e 100%); }
.hs-slide-7 { background: linear-gradient(145deg, #010101 0%, #2a0012 100%); }

/* accent glow per slide */
.hs-glow {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
  width: 240px; height: 240px; top: -60px; right: -40px;
  transition: opacity .4s ease;
}
.hs-slide-1 .hs-glow { background: radial-gradient(circle, rgba(227,30,36,.22) 0%, transparent 70%); }
.hs-slide-2 .hs-glow { background: radial-gradient(circle, rgba(245,166,35,.18) 0%, transparent 70%); }
.hs-slide-3 .hs-glow { background: radial-gradient(circle, rgba(16,185,129,.18) 0%, transparent 70%); }
.hs-slide-4 .hs-glow { background: radial-gradient(circle, rgba(59,130,246,.22) 0%, transparent 70%); }
.hs-slide-5 .hs-glow { background: radial-gradient(circle, rgba(241,100,30,.35) 0%, transparent 70%); }
.hs-slide-6 .hs-glow { background: radial-gradient(circle, rgba(238,29,82,.28) 0%, transparent 70%); }
.hs-slide-7 .hs-glow { background: radial-gradient(circle, rgba(238,29,82,.32) 0%, transparent 70%); }

/* emoji icon top-right */
.hs-emoji {
  position: absolute; top: 18px; right: 18px; z-index: 2;
  font-size: 40px; opacity: .9;
  animation: planeBob 5s ease-in-out infinite;
  filter: drop-shadow(0 3px 10px rgba(0,0,0,.3));
}
.hs-slide:nth-child(2) .hs-emoji { animation-delay: .5s; }
.hs-slide:nth-child(3) .hs-emoji { animation-delay: 1s; }
.hs-slide:nth-child(4) .hs-emoji { animation-delay: 1.5s; }

@keyframes planeBob {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-7px) rotate(2deg); }
}

/* slide text content */
.hs-content { position: relative; z-index: 3; }
.hs-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.13);
  color: rgba(255,255,255,.7); font-size: 9px; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 10px; border-radius: var(--r-f); margin-bottom: 8px;
  backdrop-filter: blur(6px);
}
.hs-title {
  font-family: var(--fd); font-size: 26px; color: #fff;
  line-height: 1.0; letter-spacing: .02em; margin-bottom: 7px;
}
.hs-title em { font-style: normal; color: var(--red); }
.hs-sub {
  font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.55;
  margin-bottom: 13px; font-weight: 400; max-width: 260px;
}
.hs-cta {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; padding: 9px 16px;
  border-radius: var(--r-f); transition: var(--trf);
}
.hs-cta:active { transform: scale(.95); }
.hs-cta-red   { background: var(--red); color: #fff; box-shadow: var(--sh-r); }
.hs-cta-ghost { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); }

/* dots */
.hs-dots {
  position: absolute; bottom: 10px; right: 16px; z-index: 10;
  display: flex; gap: 5px; align-items: center;
}
.hs-dot {
  width: 6px; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,.3); transition: all .3s ease;
}
.hs-dot.on { width: 18px; background: var(--red); }

/* progress bar */
.hs-progress {
  position: absolute; bottom: 0; left: 0; z-index: 10;
  height: 2px; background: var(--red); opacity: .7;
  transition: none;
}
.hs-progress.anim {
  transition: width 4s linear;
}

/* swipe hint arrows (hidden, touch-only) */
.hs-arrow {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
  width: 28px; height: 28px; background: rgba(255,255,255,.12);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.6); font-size: 13px; transition: var(--trf);
  border: 1px solid rgba(255,255,255,.15);
}
.hs-arrow:active { background: rgba(255,255,255,.25); }
.hs-arrow-l { left: 10px; }
.hs-arrow-r { right: 10px; }

/* ── VIDEO ELEMENTS ── */
.hs-video-wrap {
  position: absolute; inset: 0; z-index: 1; overflow: hidden;
  background: #000;
}
.hs-yt {
  position: absolute;
  /* oversized to hide YT controls/borders */
  top: -10%; left: -10%;
  width: 120%; height: 120%;
  border: none; pointer-events: none;
}
.hs-vid {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
}
/* dark overlay on top of video so text is readable */
.hs-vid-overlay {
  position: absolute; inset: 0; z-index: 2;
  background: linear-gradient(
    160deg,
    rgba(5,15,43,.72) 0%,
    rgba(5,15,43,.35) 55%,
    rgba(5,15,43,.55) 100%
  );
}
/* mute toggle button */
.hs-mute {
  position: absolute; top: 10px; left: 10px; z-index: 12;
  width: 30px; height: 30px; background: rgba(0,0,0,.4);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 13px; border: 1px solid rgba(255,255,255,.2);
  transition: var(--trf); backdrop-filter: blur(4px);
}
.hs-mute:active { background: rgba(0,0,0,.65); transform: scale(.92); }

/* ensure content sits above video */
.hs-slide .hs-glow  { z-index: 3; }
.hs-slide .hs-emoji { z-index: 5; }
.hs-slide .hs-content { z-index: 5; }

/* flag stripe */
.flag-stripe {
  height: 3px;
  background: linear-gradient(90deg, #B22234 0%,#B22234 33%,#fff 33%,#fff 66%,#3C3B6E 66%);
  opacity: .5;
}

/* Flag stripe */
.flag-stripe {
  height: 3px;
  background: linear-gradient(90deg, #B22234 0%,#B22234 33%,#fff 33%,#fff 66%,#3C3B6E 66%);
  opacity: .5;
}

/* Home stats bar */
.home-stats {
  background: var(--navy2);
  display: flex; overflow-x: auto;
}
.hs-item {
  flex: 1; min-width: 90px; text-align: center;
  padding: 14px 10px;
  border-right: 1px solid rgba(255,255,255,.07);
}
.hs-item:last-child { border-right: none; }
.hs-num {
  font-family: var(--fd); font-size: 22px; color: #fff;
  letter-spacing: .02em; line-height: 1;
}
.hs-num em { color: var(--red); font-style: normal; }
.hs-lbl {
  font-size: 9px; font-weight: 700; color: rgba(255,255,255,.4);
  text-transform: uppercase; letter-spacing: .09em; margin-top: 3px;
}

/* Trust strip */
.trust-strip {
  background: #fff; border-bottom: 1px solid var(--g200);
  display: flex; gap: 0; overflow-x: auto; padding: 0;
}
.ts-item {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; font-size: 12px; font-weight: 600;
  color: var(--g500); border-right: 1px solid var(--g200); white-space: nowrap;
}
.ts-item:last-child { border-right: none; }
.ts-icon { font-size: 16px; }

/* Section spacing */
.home-section { padding: 24px 16px 0; }
.home-section + .home-section { padding-top: 20px; }
.hs-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.hs-more { font-size: 12px; font-weight: 700; color: var(--red); }

/* How it works — timeline horizontal scroll */
.how-scroll {
  display: flex; gap: 10px;
  overflow-x: auto; padding: 4px 16px 8px;
  margin: 0 -16px;
}
.how-card {
  flex-shrink: 0; width: 200px;
  background: #fff; border-radius: var(--r-xl); padding: 18px 16px;
  border: 1.5px solid var(--g200); box-shadow: var(--sh-sm);
  position: relative; overflow: hidden;
}
.how-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--navy));
}
.how-num {
  font-family: var(--fd); font-size: 36px; color: var(--g100);
  position: absolute; top: 8px; right: 12px; line-height: 1; z-index: 0;
}
.how-icon { font-size: 28px; margin-bottom: 10px; position: relative; z-index: 1; }
.how-title {
  font-size: 13px; font-weight: 800; color: var(--navy);
  margin-bottom: 5px; position: relative; z-index: 1;
}
.how-desc { font-size: 11px; color: var(--g500); line-height: 1.55; position: relative; z-index: 1; }

/* Benefits */
.benefits-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.benefit-card {
  background: #fff; border-radius: var(--r-xl); padding: 18px 16px;
  border: 1.5px solid var(--g200); box-shadow: var(--sh-sm);
  transition: var(--trf);
}
.benefit-card:active { transform: scale(.97); }
.bc-icon {
  width: 40px; height: 40px; border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: 10px;
}
.bc-icon.navy { background: rgba(8,27,75,.08); }
.bc-icon.red  { background: rgba(227,30,36,.08); }
.bc-title { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.bc-desc  { font-size: 11px; color: var(--g500); line-height: 1.5; }

/* Category quick access */
.cat-row {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 4px 16px 8px; margin: 0 -16px;
}
.cat-pill {
  flex-shrink: 0; background: #fff; border: 1.5px solid var(--g200);
  border-radius: var(--r-xl); padding: 10px 16px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: var(--navy);
  box-shadow: var(--sh-sm); cursor: pointer; transition: var(--trf);
  white-space: nowrap;
}
.cat-pill:active { transform: scale(.95); background: var(--navy); color: #fff; }
.cat-pill-icon { font-size: 18px; }

/* Home promo card */
.home-promo {
  margin: 20px 16px 0;
  background: linear-gradient(135deg, var(--navy) 0%, #0a2070 100%);
  border-radius: var(--r-xl); padding: 20px;
  box-shadow: var(--sh-md);
}
.hp-tag { font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 7px; }
.hp-title { font-family: var(--fd); font-size: 22px; color: #fff; letter-spacing: .02em; margin-bottom: 6px; }
.hp-sub { font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.6; margin-bottom: 16px; }
.hp-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.hp-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 800; padding: 10px 18px;
  border-radius: var(--r-f); transition: var(--trf);
}
.hp-btn:active { transform: scale(.96); }
.hp-btn-r { background: var(--red); color: #fff; box-shadow: var(--sh-r); }
.hp-btn-g { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); }

/* ═══════════════════════════════════════════
   PAGE 2 — STORES
═══════════════════════════════════════════ */
#page-stores {}

/* Search */
.store-search-bar {
  background: var(--navy2);
  padding: 10px 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.ssb-wrap { position: relative; }
.ssb-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.35); pointer-events: none; }
.ssb-input {
  width: 100%; padding: 11px 38px 11px 38px;
  background: rgba(255,255,255,.09); border: 1.5px solid rgba(255,255,255,.12);
  border-radius: var(--r-f); font-size: 14px; color: #fff; outline: none;
  transition: var(--tr);
}
.ssb-input::placeholder { color: rgba(255,255,255,.35); }
.ssb-input:focus { border-color: rgba(227,30,36,.45); background: rgba(255,255,255,.13); }
.ssb-x {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; background: rgba(255,255,255,.15);
  border-radius: 50%; display: none; align-items: center; justify-content: center;
  color: rgba(255,255,255,.6); font-size: 12px;
}
.ssb-x.show { display: flex; }

/* View toggle bar */
.vtbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 2px; background: var(--off);
}
.vt-count { font-size: 12px; font-weight: 600; color: var(--g400); }
.vt-count strong { font-size: 14px; color: var(--navy); }
.vt-btns {
  display: flex; background: var(--g100);
  border-radius: var(--r-xs); padding: 3px; gap: 2px;
}
.vt-btn {
  width: 32px; height: 28px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--g400); font-size: 14px; transition: var(--trf);
}
.vt-btn.on { background: var(--navy); color: #fff; box-shadow: 0 2px 8px rgba(8,27,75,.25); }

/* ── APP STORE VIEW ── */
#sv-appstore { display: block; }
#sv-instagram { display: none; }

/* Featured hero */
.as-hero {
  margin: 12px 16px 0;
  border-radius: var(--r-xl); height: 190px;
  overflow: hidden; position: relative; cursor: pointer;
  box-shadow: var(--sh-lg); transition: var(--trf);
}
.as-hero:active { transform: scale(.98); }
.as-hero-bg { position: absolute; inset: 0; transition: transform .5s ease; }
.as-hero:active .as-hero-bg { transform: scale(1.04); }
.as-hero-ov {
  position: absolute; inset: 0;
  background: linear-gradient(155deg, rgba(8,27,75,.78) 0%, rgba(8,27,75,.2) 60%, transparent 100%);
}
.as-hero-ct {
  position: absolute; inset: 0; padding: 20px;
  display: flex; flex-direction: column; justify-content: space-between; z-index: 2;
}
.as-hero-top {}
.as-hero-htag {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(6px); color: rgba(255,255,255,.85);
  font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 10px; border-radius: var(--r-f); margin-bottom: 7px; width: fit-content;
}
.as-hero-name {
  font-family: var(--fd); font-size: 40px; color: #fff;
  letter-spacing: .03em; line-height: .93;
  text-shadow: 0 2px 14px rgba(0,0,0,.3);
}
.as-hero-sub { font-size: 12px; color: rgba(255,255,255,.6); font-weight: 500; margin-top: 4px; }
.as-hero-bot { display: flex; align-items: center; justify-content: space-between; }
.as-hero-cta {
  background: #fff; color: var(--navy);
  font-size: 12px; font-weight: 800; padding: 9px 18px;
  border-radius: var(--r-f); display: flex; align-items: center; gap: 5px;
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}
.as-hero-rating { color: rgba(255,255,255,.8); font-size: 12px; font-weight: 700; }

/* Horizontal row */
.as-row { margin-top: 20px; }
.as-row-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; margin-bottom: 10px;
}
.as-row-title { font-family: var(--fd); font-size: 19px; color: var(--navy); letter-spacing: .02em; }
.as-row-ct { font-size: 11px; font-weight: 700; color: var(--red); }
.h-scroll {
  display: flex; gap: 11px;
  padding: 3px 16px 6px; overflow-x: auto;
  scroll-snap-type: x mandatory;
}

/* Mini card */
.mc {
  flex-shrink: 0; width: 148px;
  background: #fff; border-radius: var(--r-lg);
  border: 1.5px solid var(--g200);
  overflow: hidden; cursor: pointer;
  scroll-snap-align: start; transition: var(--trf);
  box-shadow: var(--sh-sm);
}
.mc:active { transform: scale(.96); box-shadow: none; }
.mc-banner {
  height: 88px; position: relative;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.mc-bg { position: absolute; inset: 0; }
.mc-ov { position: absolute; inset: 0; background: rgba(0,0,0,.22); }
.mc-name {
  position: relative; z-index: 2;
  font-family: var(--fd); font-size: 18px; color: #fff;
  letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.4);
}
.mc-body { padding: 9px 10px 11px; }
.mc-sname { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
.mc-cat { font-size: 9px; font-weight: 700; color: var(--g400); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 7px; }
.mc-foot { display: flex; align-items: center; justify-content: space-between; }
.mc-badge {
  font-size: 8px; font-weight: 800; padding: 2px 6px;
  border-radius: var(--r-f); text-transform: uppercase; letter-spacing: .06em;
}
.mb-hot  { background: rgba(227,30,36,.1); color: var(--red); }
.mb-new  { background: rgba(16,185,129,.1); color: var(--green); }
.mb-sale { background: rgba(245,166,35,.12); color: #a06800; }
.mc-fav  { font-size: 14px; cursor: pointer; }

/* Grid 2-col */
.as-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; padding: 0 16px;
}
.tc {
  background: #fff; border-radius: var(--r-xl);
  border: 1.5px solid var(--g200); overflow: hidden;
  cursor: pointer; transition: var(--trf); box-shadow: var(--sh-sm);
  position: relative;
}
.tc:active { transform: scale(.97); box-shadow: none; }
.tc.s2 { grid-column: span 2; }
.tc-banner {
  height: 104px; position: relative;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.tc-bg { position: absolute; inset: 0; transition: transform .5s ease; }
.tc:active .tc-bg { transform: scale(1.05); }
.tc-ov { position: absolute; inset: 0; background: rgba(0,0,0,.22); }
.tc-logo {
  position: relative; z-index: 2;
  font-family: var(--fd); font-size: 24px; color: #fff;
  letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.tc.s2 .tc-banner { height: 96px; }
.tc.s2 .tc-logo { font-size: 28px; }
.tc-bdg {
  position: absolute; top: 7px; left: 7px; z-index: 3;
  font-size: 8px; font-weight: 800; padding: 3px 7px;
  border-radius: var(--r-f); text-transform: uppercase; letter-spacing: .07em;
}
.tc-bdg.hot { background: var(--red); color: #fff; }
.tc-bdg.new { background: var(--green); color: #fff; }
.tc-bdg.sale { background: var(--gold); color: #fff; }
.tc-fav {
  position: absolute; top: 7px; right: 7px; z-index: 3;
  width: 24px; height: 24px; background: rgba(255,255,255,.88);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; box-shadow: 0 1px 5px rgba(0,0,0,.12);
}
.tc-body { padding: 10px 12px 12px; }
.tc-name { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
.tc-cat { font-size: 9px; font-weight: 700; color: var(--g400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.tc-desc { font-size: 11px; color: var(--g500); line-height: 1.5; margin-bottom: 8px; }
.tc-foot { display: flex; align-items: center; justify-content: space-between; }
.tc-rating { font-size: 11px; color: var(--gold); font-weight: 700; }
.tc-ship { font-size: 9px; font-weight: 700; color: var(--green); }
.tc-btn {
  margin-top: 9px; width: 100%;
  background: var(--navy); color: #fff;
  font-size: 11px; font-weight: 700; padding: 8px;
  border-radius: var(--r-md); text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: var(--trf);
}
.tc-btn:active { background: var(--red); }

/* Promo strip (stores) */
.s-promo {
  margin: 18px 16px 0;
  background: linear-gradient(135deg, var(--navy) 0%, #0a2070 100%);
  border-radius: var(--r-xl); padding: 18px 18px;
  box-shadow: var(--sh-md);
}
.sp-tag { font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.sp-title { font-family: var(--fd); font-size: 20px; color: #fff; letter-spacing: .02em; margin-bottom: 5px; }
.sp-sub { font-size: 11px; color: rgba(255,255,255,.5); line-height: 1.6; margin-bottom: 14px; }
.sp-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--red); color: #fff;
  font-size: 11px; font-weight: 800; padding: 10px 18px;
  border-radius: var(--r-f); box-shadow: var(--sh-r);
}

/* ── INSTAGRAM VIEW ── */
.ig-sec-lbl {
  padding: 14px 16px 9px;
  font-family: var(--fd); font-size: 18px; color: var(--navy);
  letter-spacing: .02em; display: flex; align-items: center; gap: 8px;
}
.ig-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 3px; padding: 0 3px;
}
.ig-item {
  aspect-ratio: 1; position: relative; overflow: hidden;
  cursor: pointer; border-radius: 5px; transition: var(--trf);
}
.ig-item:active { opacity: .82; transform: scale(.96); }
.ig-item.big { grid-column: span 2; grid-row: span 2; border-radius: 8px; }
.ig-bg { position: absolute; inset: 0; transition: transform .5s ease; }
.ig-ov {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(8,27,75,.88) 0%, rgba(8,27,75,.2) 50%, transparent 100%);
  transition: var(--tr);
}
.ig-item:active .ig-ov { background: linear-gradient(to top, rgba(227,30,36,.8) 0%, rgba(8,27,75,.35) 100%); }
.ig-logo { position: absolute; bottom: 0; left: 0; right: 0; padding: 7px; z-index: 2; }
.ig-name {
  font-family: var(--fd); color: #fff; letter-spacing: .04em;
  text-shadow: 0 1px 5px rgba(0,0,0,.4); line-height: 1;
}
.ig-item.big .ig-name { font-size: 24px; }
.ig-item:not(.big) .ig-name { font-size: 12px; }
.ig-subcat {
  font-size: 9px; font-weight: 600; color: rgba(255,255,255,.5);
  text-transform: uppercase; letter-spacing: .07em; margin-top: 1px; display: none;
}
.ig-item.big .ig-subcat { display: block; }
.ig-bdg {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 9px;
  backdrop-filter: blur(4px);
}
.ig-bdg.hot  { background: rgba(227,30,36,.85); }
.ig-bdg.new  { background: rgba(16,185,129,.85); }
.ig-bdg.sale { background: rgba(245,166,35,.85); }
.ig-fav { position: absolute; top: 6px; left: 6px; z-index: 3; font-size: 12px; opacity: .85; }

/* no results */
.no-res { text-align: center; padding: 60px 20px; display: none; }
.no-res-icon { font-size: 48px; margin-bottom: 12px; }
.no-res h3 { font-family: var(--fd); font-size: 24px; color: var(--navy); margin-bottom: 6px; }
.no-res p { font-size: 13px; color: var(--g400); }

/* ═══════════════════════════════════════════
   PAGE 3 — TRACKING
═══════════════════════════════════════════ */
#page-track {}

.track-hero {
  background: linear-gradient(155deg, var(--navy3) 0%, #0a1f55 100%);
  padding: 28px 20px 32px; position: relative; overflow: hidden;
}
.th-glow {
  position: absolute; border-radius: 50%; pointer-events: none;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(227,30,36,.15) 0%, transparent 70%);
  top: -80px; right: -60px;
}
.th-content { position: relative; z-index: 2; }
.th-eyebrow { margin-bottom: 12px; }
.th-h { font-family: var(--fd); font-size: 34px; color: #fff; letter-spacing: .02em; margin-bottom: 8px; }
.th-sub { font-size: 13px; color: rgba(255,255,255,.55); line-height: 1.6; margin-bottom: 22px; }

/* Track input */
.track-form { display: flex; gap: 8px; }
.ti-wrap { flex: 1; position: relative; }
.ti-input {
  width: 100%; padding: 13px 16px;
  background: rgba(255,255,255,.09); border: 1.5px solid rgba(255,255,255,.15);
  border-radius: var(--r-f); font-family: var(--fm); font-size: 13px; color: #fff;
  letter-spacing: .06em; outline: none; transition: var(--tr);
}
.ti-input::placeholder { color: rgba(255,255,255,.3); font-family: var(--fm); }
.ti-input:focus { border-color: rgba(227,30,36,.5); background: rgba(255,255,255,.13); }
.ti-btn {
  background: var(--red); color: #fff;
  font-size: 13px; font-weight: 800; padding: 13px 20px;
  border-radius: var(--r-f); box-shadow: var(--sh-r); transition: var(--trf);
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
}
.ti-btn:active { transform: scale(.95); }

/* Track result card */
.track-result {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--r-xl); padding: 20px; margin-top: 18px;
  display: none; backdrop-filter: blur(16px);
}
.track-result.show { display: block; animation: fadeUp .4s ease; }
.tr-header {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px;
}
.tr-id { font-family: var(--fm); font-size: 12px; color: rgba(255,255,255,.55); }
.tr-status {
  background: rgba(16,185,129,.2); color: #34d399;
  font-size: 10px; font-weight: 800; padding: 4px 12px;
  border-radius: var(--r-f); border: 1px solid rgba(16,185,129,.3); letter-spacing: .06em;
}
.tr-steps {}
.tr-step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.tr-step:last-child { margin-bottom: 0; }
.tr-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(255,255,255,.2); flex-shrink: 0; margin-top: 3px;
}
.tr-step.done .tr-dot  { background: var(--green); box-shadow: 0 0 7px rgba(16,185,129,.5); }
.tr-step.now  .tr-dot  { background: var(--gold); box-shadow: 0 0 7px rgba(245,166,35,.5); animation: pulse 1.5s infinite; }
.tr-info {}
.tr-label { font-size: 12px; font-weight: 700; color: #fff; }
.tr-date  { font-size: 10px; color: rgba(255,255,255,.38); margin-top: 2px; font-family: var(--fm); }

/* Map card */
.map-card {
  margin: 16px 16px 0;
  background: #fff; border-radius: var(--r-xl);
  overflow: hidden; box-shadow: var(--sh-md);
}
.map-vis {
  height: 200px; background: var(--navy3);
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.map-inner { position: relative; width: 100%; height: 100%; }
.map-route-line {
  stroke-dasharray: 300; stroke-dashoffset: 300;
  animation: drawLine 2.5s ease .5s forwards;
}
@keyframes drawLine { to { stroke-dashoffset: 0; } }
.map-plane-anim { animation: planeBob 3s ease-in-out infinite; }

.map-bar {
  display: flex; padding: 14px 18px; gap: 0;
  border-top: 1px solid var(--g200);
}
.mb-item { flex: 1; }
.mb-item + .mb-item { border-left: 1px solid var(--g200); padding-left: 16px; }
.mb-lbl { font-size: 10px; font-weight: 700; color: var(--g400); text-transform: uppercase; letter-spacing: .08em; }
.mb-val { font-size: 14px; font-weight: 800; color: var(--navy); margin-top: 2px; }
.mb-val.green { color: var(--green); }

/* Quick stats */
.qstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px 0; }
.qs-card {
  background: #fff; border-radius: var(--r-lg); padding: 14px 16px;
  box-shadow: var(--sh-sm); border: 1.5px solid var(--g200);
}
.qs-lbl { font-size: 10px; font-weight: 700; color: var(--g400); text-transform: uppercase; letter-spacing: .07em; }
.qs-val { font-family: var(--fd); font-size: 24px; color: var(--navy); margin-top: 4px; }
.qs-val.red   { color: var(--red); }
.qs-val.green { color: var(--green); }

/* ═══════════════════════════════════════════
   PAGE 4 — CALCULATOR
═══════════════════════════════════════════ */
#page-calc {}

.calc-hero {
  background: var(--navy3); padding: 24px 20px 28px; position: relative; overflow: hidden;
}
.ch-glow {
  position: absolute; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(8,50,180,.22) 0%, transparent 70%);
  bottom: -80px; right: -60px; pointer-events: none;
}
.ch-content { position: relative; z-index: 2; }
.ch-h { font-family: var(--fd); font-size: 30px; color: #fff; letter-spacing: .02em; margin-bottom: 6px; }
.ch-sub { font-size: 13px; color: rgba(255,255,255,.5); line-height: 1.6; }

/* Calc card */
.calc-card {
  margin: 14px 16px 0;
  background: #fff; border-radius: var(--r-xl);
  padding: 20px; box-shadow: var(--sh-lg);
  border: 1.5px solid var(--g200);
}
.cc-title {
  font-size: 15px; font-weight: 800; color: var(--navy);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.cc-field {}
.cc-label {
  font-size: 10px; font-weight: 800; color: var(--g500);
  text-transform: uppercase; letter-spacing: .09em; display: block; margin-bottom: 6px;
}
.cc-iw { position: relative; }
.cc-input, .cc-select {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--g200); border-radius: var(--r-md);
  font-size: 14px; color: var(--g800); background: #fff; outline: none;
  transition: var(--trf); -webkit-appearance: none;
}
.cc-input:focus, .cc-select:focus {
  border-color: var(--navy); box-shadow: 0 0 0 3px rgba(8,27,75,.07);
}
.cc-unit {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  font-size: 10px; font-weight: 800; color: var(--g400); text-transform: uppercase;
}
.cc-full { grid-column: span 2; }
.cc-btn {
  width: 100%; padding: 15px; border-radius: var(--r-lg);
  background: var(--red); color: #fff;
  font-size: 14px; font-weight: 800; letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: var(--sh-r); transition: var(--trf);
}
.cc-btn:active { transform: scale(.98); }

/* Calc result */
.calc-res {
  margin-top: 14px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy3) 100%);
  border-radius: var(--r-lg); padding: 18px;
  display: none;
}
.calc-res.show { display: block; animation: fadeUp .4s ease; }
.cr-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 13px; color: rgba(255,255,255,.55);
}
.cr-row span:last-child { color: rgba(255,255,255,.85); font-weight: 600; }
.cr-row:last-child {
  margin-bottom: 0; padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,.1);
  font-size: 16px; font-weight: 800; color: #fff;
}
.cr-row:last-child span:last-child { color: var(--green2); font-size: 20px; }

/* Calc info cards */
.calc-info { padding: 14px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ci-card {
  background: #fff; border-radius: var(--r-lg); padding: 14px;

.ci-icon { font-size: 22px; margin-bottom: 8px; }
.ci-title { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.ci-desc  { font-size: 11px; color: var(--g500); line-height: 1.5; }

/* ═══════════════════════════════════════════
   PAGE 5 — ACCOUNT
═══════════════════════════════════════════ */
#page-account {}

.acct-hero {
  background: linear-gradient(155deg, var(--navy3) 0%, var(--navy2) 100%);
  padding: 28px 20px 32px; text-align: center; position: relative; overflow: hidden;
}
.acct-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, var(--red), var(--navy2));

.acct-address-card {

}

/* Acct stats */
.acct-stats {
  display: flex; background: #fff; border-bottom: 1px solid var(--g200);
}
.as-stat { flex: 1; text-align: center; padding: 16px 8px; border-right: 1px solid var(--g200); }
.as-stat:last-child { border-right: none; }
.as-stat-num { font-family: var(--fd); font-size: 22px; color: var(--navy); }
.as-stat-lbl { font-size: 10px; font-weight: 600; color: var(--g400); text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }

/* Acct menu */
.acct-menu { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.am-item {
  background: #fff; border-radius: var(--r-lg); padding: 16px;
  display: flex; align-items: center; gap: 14px;
  border: 1.5px solid var(--g200); box-shadow: var(--sh-sm);

}

.am-icon {

}
.am-icon.n { background: rgba(8,27,75,.07); }
.am-icon.r { background: rgba(227,30,36,.07); }
.am-icon.g { background: rgba(16,185,129,.07); }
.am-icon.o { background: rgba(245,166,35,.08); }
.am-text { flex: 1; }
.am-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
.am-sub   { font-size: 11px; color: var(--g400); }
.am-arrow { color: var(--g300); font-size: 16px; }

.acct-cta {
  margin: 0 16px 4px;
  background: var(--red); border-radius: var(--r-xl); padding: 18px;
  text-align: center; box-shadow: var(--sh-r);
}
.acct-cta p { font-family: var(--fd); font-size: 20px; color: #fff; letter-spacing: .03em; margin-bottom: 4px; }
.acct-cta span { font-size: 12px; color: rgba(255,255,255,.65); }

/* ═══════════════════════════════════════════
   PAGE — STORE DETAIL
═══════════════════════════════════════════ */
.sd-hero {
  height: 220px; position: relative;
  display: flex; align-items: flex-end;
  overflow: hidden;
}
.sd-hero-bg   { position: absolute; inset: 0; transition: transform .5s ease; }
.sd-hero-ov   {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(5,15,43,.95) 0%, rgba(5,15,43,.3) 60%, transparent 100%);
}
.sd-back {
  position: absolute; top: 14px; left: 14px; z-index: 10;
  width: 34px; height: 34px; background: rgba(0,0,0,.35);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px; backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.2); transition: var(--trf);
}
.sd-back:active { background: rgba(0,0,0,.6); }
.sd-hero-info {
  position: relative; z-index: 5;
  padding: 0 18px 18px; width: 100%;
}
.sd-store-name {
  font-family: var(--fd); font-size: 38px; color: #fff;
  letter-spacing: .03em; line-height: .95;
  text-shadow: 0 2px 12px rgba(0,0,0,.4);
}
.sd-store-cat {
  font-size: 11px; font-weight: 700; color: rgba(255,255,255,.55);
  text-transform: uppercase; letter-spacing: .1em; margin-top: 4px;
}
.sd-rating-row {
  display: flex; align-items: center; gap: 10px; margin-top: 8px;
}
.sd-stars { color: var(--gold); font-size: 13px; }
.sd-rating-num { font-size: 13px; font-weight: 700; color: #fff; }
.sd-badge-hero {
  font-size: 9px; font-weight: 800; padding: 3px 9px;
  border-radius: var(--r-f); text-transform: uppercase; letter-spacing: .08em;
}
.sd-badge-hero.hot  { background: var(--red); color: #fff; }
.sd-badge-hero.new  { background: var(--green); color: #fff; }
.sd-badge-hero.sale { background: var(--gold); color: #fff; }

/* Action buttons row */
.sd-actions {
  display: flex; gap: 10px; padding: 14px 16px;
  background: #fff; border-bottom: 1px solid var(--g200);
}
.sd-btn {
  flex: 1; padding: 12px 10px; border-radius: var(--r-lg);
  font-size: 12px; font-weight: 800; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: var(--trf); letter-spacing: .01em;
}
.sd-btn:active { transform: scale(.96); }
.sd-btn-primary { background: var(--navy); color: #fff; box-shadow: 0 3px 12px rgba(8,27,75,.25); }
.sd-btn-red     { background: var(--red);  color: #fff; box-shadow: var(--sh-r); }

/* Info strip */
.sd-info-strip {
  display: flex; background: var(--off);
  border-bottom: 1px solid var(--g200);
}
.sd-info-item {
  flex: 1; text-align: center; padding: 12px 6px;
  border-right: 1px solid var(--g200);
}
.sd-info-item:last-child { border-right: none; }
.sd-info-icon { font-size: 18px; margin-bottom: 3px; }
.sd-info-lbl  { font-size: 9px; font-weight: 700; color: var(--g400); text-transform: uppercase; letter-spacing: .07em; }
.sd-info-val  { font-size: 12px; font-weight: 800; color: var(--navy); margin-top: 2px; }
.sd-info-val.green { color: var(--green); }

/* Store description */
.sd-desc-block {
  padding: 16px 16px 0; background: #fff;
  border-bottom: 1px solid var(--g200);
}
.sd-desc-title { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
.sd-desc-text  { font-size: 13px; color: var(--g500); line-height: 1.65; margin-bottom: 14px; }

/* Perks */
.sd-perks {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; padding: 14px 16px 0;
}
.sd-perk {
  background: var(--off); border-radius: var(--r-md);
  padding: 10px 12px; display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; color: var(--navy);
  border: 1px solid var(--g200);
}
.sd-perk span { font-size: 16px; }

/* Section title */
.sd-sec {
  padding: 18px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.sd-sec-title { font-family: var(--fd); font-size: 20px; color: var(--navy); letter-spacing: .02em; }
.sd-sec-more  { font-size: 11px; font-weight: 700; color: var(--red); }

/* Product horizontal scroll */
.sd-products-scroll {
  display: flex; gap: 12px;
  padding: 2px 16px 12px; overflow-x: auto;
  scroll-snap-type: x mandatory;
}

/* Product card */
.sd-prod {
  flex-shrink: 0; width: 150px;
  background: #fff; border-radius: var(--r-lg);
  border: 1.5px solid var(--g200); overflow: hidden;
  cursor: pointer; scroll-snap-align: start;
  box-shadow: var(--sh-sm); transition: var(--trf);
}
.sd-prod:active { transform: scale(.96); }
.sd-prod-img {
  height: 120px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 52px;
}
.sd-prod-img-bg { position: absolute; inset: 0; opacity: .15; }
.sd-prod-body { padding: 9px 10px 11px; }
.sd-prod-name { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 3px; line-height: 1.3; }
.sd-prod-price {
  font-size: 14px; font-weight: 800; color: var(--red); margin-bottom: 4px;
}
.sd-prod-ship { font-size: 9px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
.sd-prod-btn {
  width: 100%; background: var(--navy); color: #fff;
  font-size: 10px; font-weight: 800; padding: 7px;
  border-radius: var(--r-sm); text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: var(--trf);
}
.sd-prod-btn:active { background: var(--red); }

/* Category pills inside store */
.sd-cats {
  display: flex; gap: 8px; padding: 0 16px 14px;
  overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
}
.sd-cat-pill {
  flex-shrink: 0; padding: 7px 14px; border-radius: var(--r-f);
  font-size: 11px; font-weight: 700; color: var(--g500);
  background: var(--g100); border: 1.5px solid transparent;
  transition: var(--trf); white-space: nowrap; cursor: pointer;
}
.sd-cat-pill.on { background: var(--navy); color: #fff; }
.sd-cat-pill:active { transform: scale(.95); }

/* Quick ship calc inside store */
.sd-ship-calc {
  margin: 0 16px 16px;
  background: linear-gradient(135deg, var(--navy) 0%, #0a2070 100%);
  border-radius: var(--r-xl); padding: 18px;
  box-shadow: var(--sh-md);
}
.sd-sc-title { font-family: var(--fd); font-size: 18px; color: #fff; letter-spacing: .02em; margin-bottom: 4px; }
.sd-sc-sub   { font-size: 11px; color: rgba(255,255,255,.5); margin-bottom: 14px; }
.sd-sc-row   { display: flex; gap: 8px; margin-bottom: 8px; }
.sd-sc-input {
  flex: 1; padding: 10px 12px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--r-md); font-size: 13px; color: #fff; outline: none;
  min-width: 0;
}
.sd-sc-input::placeholder { color: rgba(255,255,255,.35); }
.sd-sc-select {
  flex: 1; padding: 10px 10px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--r-md); font-size: 12px; color: #fff; outline: none;
  -webkit-appearance: none; min-width: 0;
}
.sd-sc-btn {
  width: 100%; padding: 12px; border-radius: var(--r-lg);
  background: var(--red); color: #fff;
  font-size: 13px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: var(--sh-r); transition: var(--trf);
}
.sd-sc-btn:active { transform: scale(.97); }
.sd-sc-result {
  margin-top: 10px; background: rgba(255,255,255,.08);
  border-radius: var(--r-md); padding: 12px 14px; display: none;
}
.sd-sc-result.show { display: block; animation: fadeUp .3s ease; }
.sd-sc-res-row {
  display: flex; justify-content: space-between;
  font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 6px;
}
.sd-sc-res-row:last-child {
  margin-bottom: 0; padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,.1);
  font-size: 15px; font-weight: 800; color: #fff;
}
.sd-sc-res-row span:last-child { color: var(--green2); }

/* ── Rating bars + Reviews ── */
.sd-rating-block {
  padding: 16px 16px 0;
  background: #fff; border-bottom: 1px solid var(--g200);
}
.sd-rating-block-title {
  font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 12px;
}
.sd-rating-big {
  display: flex; align-items: center; gap: 16px; margin-bottom: 14px;
}
.sd-rating-score {
  font-family: var(--fd); font-size: 52px; color: var(--navy);
  line-height: 1; letter-spacing: .01em;
}
.sd-rating-detail {}
.sd-rating-stars-big {
  color: var(--gold); font-size: 18px; letter-spacing: 1px; margin-bottom: 3px;
}
.sd-rating-count {
  font-size: 11px; color: var(--g400); font-weight: 600;
}
.sd-bars { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.sd-bar-row {
  display: flex; align-items: center; gap: 8px;
}
.sd-bar-lbl { font-size: 10px; font-weight: 700; color: var(--g500); width: 10px; text-align: right; flex-shrink: 0; }
.sd-bar-track {
  flex: 1; height: 6px; background: var(--g100);
  border-radius: 3px; overflow: hidden;
}
.sd-bar-fill {
  height: 100%; border-radius: 3px; background: var(--gold);
  transition: width .6s ease;
}
.sd-bar-pct { font-size: 10px; font-weight: 700; color: var(--g400); width: 28px; flex-shrink: 0; }

/* Review cards */
.sd-reviews { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.sd-review {
  background: var(--off); border-radius: var(--r-lg);
  padding: 12px 14px; border: 1px solid var(--g200);
}
.sd-review-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
}
.sd-review-author { display: flex; align-items: center; gap: 8px; }
.sd-review-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.sd-review-name { font-size: 12px; font-weight: 800; color: var(--navy); }
.sd-review-location { font-size: 10px; color: var(--g400); font-weight: 500; }
.sd-review-stars { color: var(--gold); font-size: 11px; }
.sd-review-text { font-size: 12px; color: var(--g600); line-height: 1.6; }
.sd-review-date { font-size: 10px; color: var(--g400); margin-top: 5px; }

.pd-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 802;
  background: #fff; border-radius: 24px 24px 0 0;
  max-height: 85vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(.34,1.18,.64,1);
  padding-bottom: calc(20px + var(--sab));
}
.pd-sheet.open { transform: translateY(0); }
.pd-drag { width: 36px; height: 4px; background: var(--g200); border-radius: 2px; margin: 12px auto 0; }
.pd-emoji { font-size: 64px; text-align: center; padding: 16px 0 8px; }
.pd-body  { padding: 0 20px 20px; }
.pd-name  { font-family: var(--fd); font-size: 24px; color: var(--navy); margin-bottom: 4px; }
.pd-store { font-size: 11px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; }
.pd-price { font-size: 28px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.pd-ship  { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 14px; }
.pd-desc  { font-size: 13px; color: var(--g500); line-height: 1.65; margin-bottom: 18px; }
.pd-actions { display: flex; gap: 10px; }
.pd-btn {
  flex: 1; padding: 14px; border-radius: var(--r-lg);
  font-size: 13px; font-weight: 800; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: var(--trf);
}
.pd-btn:active { transform: scale(.97); }
.pd-btn-n { background: var(--navy); color: #fff; }
.pd-btn-r { background: var(--red);  color: #fff; box-shadow: var(--sh-r); }

.sheet-overlay {
  position: fixed; inset: 0; z-index: 800;
  background: rgba(5,15,43,.65); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.sheet-overlay.open { opacity: 1; pointer-events: all; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 801;
  background: #fff; border-radius: 24px 24px 0 0;
  max-height: 88vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(.34,1.18,.64,1);
  padding-bottom: calc(24px + var(--sab));
}
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-drag {
  width: 36px; height: 4px; background: var(--g200);
  border-radius: 2px; margin: 12px auto 0;
}
.sh-hero {
  height: 175px; position: relative;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.sh-hero-bg { position: absolute; inset: 0; }
.sh-hero-ov { position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.sh-hero-logo {
  position: relative; z-index: 2;
  font-family: var(--fd); font-size: 52px; color: #fff;
  letter-spacing: .04em; text-shadow: 0 4px 20px rgba(0,0,0,.35);
}
.sh-close {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  width: 30px; height: 30px; background: rgba(255,255,255,.2);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; transition: var(--trf);
}
.sh-close:active { background: rgba(255,255,255,.35); }
.sh-body { padding: 18px 18px 0; }
.sh-name { font-family: var(--fd); font-size: 27px; color: var(--navy); margin-bottom: 2px; }
.sh-cat  { font-size: 10px; font-weight: 800; color: var(--red); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 11px; }
.sh-desc { font-size: 13px; color: var(--g500); line-height: 1.68; margin-bottom: 16px; }
.sh-perks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 18px; }
.sh-perk {
  background: var(--off); border-radius: var(--r-md); padding: 10px 11px;
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; color: var(--navy);
}
.sh-perk span { font-size: 15px; }
.sh-actions { display: flex; gap: 9px; }
.sh-btn {
  flex: 1; padding: 13px; border-radius: var(--r-lg);
  font-size: 13px; font-weight: 800; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: var(--trf);
}
.sh-btn:active { transform: scale(.97); }
.sh-btn-n { background: var(--navy); color: #fff; box-shadow: 0 4px 14px rgba(8,27,75,.3); }
.sh-btn-r { background: var(--red); color: #fff; box-shadow: var(--sh-r); }
/* ═══════════════════════════════════════════
   APHRODITE AI — PAGE & CHAT
═══════════════════════════════════════════ */

/* Bottom nav AI center button */
.bn-ai { position: relative; }
.bn-ai-btn {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--red), #ff6b9d);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: -4px;
  box-shadow: 0 4px 16px rgba(227,30,36,.45);
  transition: var(--trf);
}
.bn-item.active .bn-ai-btn {
  box-shadow: 0 6px 22px rgba(227,30,36,.6);
  transform: scale(1.08);
}

/* Floating AI button */
.ai-float-btn {
  position: fixed; bottom: calc(var(--bnav-h) + var(--sab) + 14px); right: 18px;
  width: 52px; height: 52px; z-index: 599;
  background: linear-gradient(135deg, var(--navy), var(--red));
  border: none; border-radius: 50%; font-size: 22px;
  box-shadow: 0 6px 24px rgba(8,27,75,.4), 0 2px 8px rgba(227,30,36,.3);
  cursor: pointer; transition: var(--tr);
  display: flex; align-items: center; justify-content: center;
  animation: aiPulseBtn 3s ease-in-out infinite;
}
.ai-float-btn:active { transform: scale(.92); }
@keyframes aiPulseBtn {
  0%,100% { box-shadow: 0 6px 24px rgba(8,27,75,.4), 0 0 0 0 rgba(227,30,36,.3); }
  50%      { box-shadow: 0 6px 24px rgba(8,27,75,.4), 0 0 0 10px rgba(227,30,36,0); }
}
.ai-float-pulse {
  position: absolute; top: 2px; right: 2px;
  width: 12px; height: 12px; background: var(--green);
  border-radius: 50%; border: 2px solid #fff;
  animation: pulse 2s infinite;
}

/* Floating chat sheet */
.ai-float-overlay {
  position: fixed; inset: 0; z-index: 700;
  background: rgba(5,15,43,.5); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.ai-float-overlay.open { opacity: 1; pointer-events: all; }
.ai-float-sheet {
  position: fixed; left: 12px; right: 12px;
  bottom: calc(var(--bnav-h) + var(--sab) + 80px);
  z-index: 701; background: #fff;
  border-radius: var(--r-xl);
  box-shadow: var(--sh-xl);
  transform: translateY(20px) scale(.96);
  opacity: 0; pointer-events: none;
  transition: all .35s cubic-bezier(.34,1.2,.64,1);
  overflow: hidden; max-height: 65vh;
  display: flex; flex-direction: column;
}
.ai-float-sheet.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }

.ai-float-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--g200);
  background: var(--g50);
}
.ai-float-title { display: flex; align-items: center; gap: 10px; }
.ai-float-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--navy), var(--red));
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.ai-float-msgs {
  flex: 1; overflow-y: auto; padding: 14px 14px 8px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 120px; max-height: 280px;
}
.ai-float-input-row {
  display: flex; gap: 8px; padding: 10px 14px;
  border-top: 1px solid var(--g200); background: #fff;
}
.ai-float-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--g200);
  border-radius: var(--r-f); font-size: 13px; outline: none;
  transition: var(--trf); font-family: var(--fb);
}
.ai-float-input:focus { border-color: var(--navy); }
.ai-float-send {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--red); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--trf); flex-shrink: 0;
}
.ai-float-send:active { transform: scale(.92); }

/* AI Page */
.ai-hero {
  background: linear-gradient(160deg, var(--navy3) 0%, #0a1f4e 100%);
  padding: 28px 20px 24px; text-align: center; position: relative; overflow: hidden;
}
.ai-hero-glow {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(227,30,36,.18) 0%, transparent 70%);
  pointer-events: none;
}
.ai-avatar-wrap { position: relative; display: inline-block; margin-bottom: 14px; }
.ai-avatar {
  width: 72px; height: 72px; border-radius: 50%; margin: 0 auto;
  background: linear-gradient(135deg, var(--navy2), var(--red3));
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; position: relative; z-index: 2;
  box-shadow: 0 8px 32px rgba(227,30,36,.35);
}
.ai-avatar-ring {
  position: absolute; inset: -5px; border-radius: 50%;
  border: 2px solid rgba(227,30,36,.4);
  animation: aiRing 2.5s ease-in-out infinite;
}
@keyframes aiRing {
  0%,100% { transform: scale(1); opacity: .8; }
  50%      { transform: scale(1.1); opacity: .3; }
}
.ai-avatar-inner { position: relative; z-index: 3; }
.ai-hero-name {
  font-family: var(--fd); font-size: 28px; color: #fff;
  letter-spacing: .04em; margin-bottom: 4px;
}
.ai-hero-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 18px; }

/* Mode buttons */
.ai-modes {
  display: flex; gap: 7px; justify-content: center; flex-wrap: wrap;
}
.ai-mode-btn {
  padding: 7px 14px; border-radius: var(--r-f); border: none;
  font-size: 12px; font-weight: 700; cursor: pointer;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.7);
  border: 1.5px solid rgba(255,255,255,.15); transition: var(--trf);
  font-family: var(--fb);
}
.ai-mode-btn.active {
  background: var(--red); color: #fff;
  border-color: var(--red); box-shadow: 0 3px 12px rgba(227,30,36,.4);
}
.ai-mode-btn:active { transform: scale(.94); }

/* Suggestions */
.ai-suggestions {
  display: flex; gap: 8px; padding: 12px 16px 4px;
  overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  background: var(--g50); border-bottom: 1px solid var(--g200);
}
.ai-sugg-chip {
  flex-shrink: 0; padding: 7px 13px; border-radius: var(--r-f);
  font-size: 12px; font-weight: 600; cursor: pointer;
  background: #fff; color: var(--navy); border: 1.5px solid var(--g200);
  white-space: nowrap; transition: var(--trf); font-family: var(--fb);
}
.ai-sugg-chip:active { background: var(--navy); color: #fff; border-color: var(--navy); transform: scale(.95); }

/* Chat area */
.ai-chat {
  flex: 1; overflow-y: auto; padding: 16px 14px 8px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--off);
  /* height = page minus hero, suggestions, input */
  min-height: 200px;
}

/* Messages */
.ai-msg {
  display: flex; gap: 8px; align-items: flex-end;
  animation: fadeUp .3s ease;
}
.ai-msg-bot { flex-direction: row; }
.ai-msg-user { flex-direction: row-reverse; }
.ai-msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--navy), var(--red));
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.ai-msg-bubble {
  max-width: 78%; padding: 11px 14px; border-radius: 18px;
  font-size: 13px; line-height: 1.6; font-family: var(--fb);
}
.ai-msg-bot  .ai-msg-bubble { background: #fff; color: var(--g800); border-bottom-left-radius: 4px; box-shadow: var(--sh-sm); }
.ai-msg-user .ai-msg-bubble { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }

/* Typing indicator */
.ai-typing { display: flex; gap: 4px; padding: 8px 12px; align-items: center; }
.ai-typing span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--g400);
  animation: aiTyping 1.2s ease-in-out infinite;
}
.ai-typing span:nth-child(2) { animation-delay: .2s; }
.ai-typing span:nth-child(3) { animation-delay: .4s; }
@keyframes aiTyping {
  0%,60%,100% { transform: translateY(0); opacity: .5; }
  30%          { transform: translateY(-6px); opacity: 1; }
}

/* AI Input bar */
.ai-input-bar {
  display: flex; gap: 8px; padding: 10px 14px;
  background: #fff; border-top: 1px solid var(--g200);
  position: sticky; bottom: 0;
  padding-bottom: calc(10px + var(--sab));
}
.ai-quick-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--g100); border: 1.5px solid var(--g200);
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: var(--trf);
}
.ai-quick-btn:active { background: var(--g200); }
.ai-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--g200);
  border-radius: var(--r-f); font-size: 14px; outline: none;
  transition: var(--trf); font-family: var(--fb);
}
.ai-input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(8,27,75,.07); }
.ai-send-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--red); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--trf); flex-shrink: 0;
  box-shadow: var(--sh-r);
}
.ai-send-btn:active { transform: scale(.92); }
.ai-send-btn:disabled { background: var(--g300); box-shadow: none; }
